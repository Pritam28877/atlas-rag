name: Harness Python quality

on:
  pull_request:
    paths:
      - ".github/workflows/harness-python-quality.yml"
      - "app/api/v1/harness/**"
      - "app/cli/harness/**"
      - "app/core/config.py"
      - "app/core/harness_config.py"
      - "app/services/harness/**"
      - "docs/harness/**"
      - ".node-version"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "scripts/probe_harness_python_isolation.py"
      - "scripts/run_harness_bedrock_smoke.py"
      - "scripts/verify_harness_*.py"
      - "tests/test_harness_*.py"
      - "tests/harness/**"
      - "uv.lock"
  push:
    branches:
      - develop
      - main
    paths:
      - ".github/workflows/harness-python-quality.yml"
      - "app/api/v1/harness/**"
      - "app/cli/harness/**"
      - "app/core/config.py"
      - "app/core/harness_config.py"
      - "app/services/harness/**"
      - "docs/harness/**"
      - ".node-version"
      - "package-lock.json"
      - "package.json"
      - "pyproject.toml"
      - "scripts/probe_harness_python_isolation.py"
      - "scripts/run_harness_bedrock_smoke.py"
      - "scripts/verify_harness_*.py"
      - "tests/test_harness_*.py"
      - "tests/harness/**"
      - "uv.lock"

permissions:
  contents: read

concurrency:
  group: harness-python-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  non-live-quality:
    name: Python 3.12 non-live gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned uv and Python
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: false
          python-version: "3.12"
          version: "0.11.3"

      - name: Install pinned Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: ".node-version"
          package-manager-cache: false

      - name: Synchronize locked development environment
        run: uv sync --locked --dev

      - name: Synchronize locked generated-contract tooling
        run: npm ci --ignore-scripts --no-audit

      - name: Lint
        run: uv run --locked ruff check .

      - name: Type check new harness packages
        run: uv run --locked mypy

      - name: Verify provenance
        run: uv run --locked python scripts/verify_harness_provenance.py

      - name: Verify privileged-operation policy
        run: uv run --locked python scripts/verify_harness_privileged_operations.py

      - name: Verify Python package boundaries
        run: uv run --locked python scripts/verify_harness_python_boundaries.py

      - name: Verify dependency sources, licenses, and vulnerabilities
        run: uv run --locked python scripts/verify_harness_supply_chain.py

      - name: Verify generated artifacts
        run: uv run --locked python scripts/verify_harness_generated_artifacts.py

      - name: Verify generated protocol is current
        run: uv run --locked python scripts/generate_harness_protocol.py --check

      - name: Type-check generated protocol
        run: npm run typecheck:harness-protocol

      - name: Verify reproducible SBOM
        run: uv run --locked python scripts/verify_harness_sbom.py

      - name: Run non-live test suite
        run: uv run --locked pytest -q -m "not ocr_integration"

      - name: Verify reproducible source and wheel distributions
        run: uv run --locked python scripts/verify_harness_packages.py
