[project]
name = "rag-api"
version = "0.1.0"
description = "Minimal FastAPI foundation for a retrieval-augmented generation service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "pydantic-settings>=2.6,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "jsonschema>=4.23,<5.0",
    "pypdf>=6.14,<7.0",
    "pytest>=8.3,<9.0",
    "reportlab>=4.2,<5.0",
    "ruff>=0.8,<1.0",
]
infra-benchmark = [
    "boto3>=1.35,<2.0",
    "pika>=1.3,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]
ocr-benchmark = [
    "docling==2.111.0",
    "easyocr>=1.7,<2.0",
    "onnxruntime>=1.20,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
