[project]
name = "rag-api"
version = "0.1.0"
description = "Minimal FastAPI foundation for a retrieval-augmented generation service."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14,<2.0",
    "boto3>=1.35,<2.0",
    "celery>=5.6,<5.7",
    "fastapi>=0.115,<1.0",
    "fastembed==0.8.0",
    "httpx>=0.27,<1.0",
    "opentelemetry-api>=1.30,<2.0",
    "opentelemetry-exporter-otlp-proto-http>=1.30,<2.0",
    "opentelemetry-sdk>=1.30,<2.0",
    "pillow>=12.3,<13",
    "prometheus-client>=0.21,<1.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "pydantic-settings>=2.6,<3.0",
    "pyjwt[crypto]>=2.10,<3.0",
    "pypdf>=6.14,<7.0",
    "sqlalchemy>=2.0,<2.1",
    "uvicorn[standard]>=0.30,<1.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "jsonschema>=4.23,<5.0",
    "pytest>=9.0.3,<10",
    "reportlab>=4.2,<5.0",
    "ruff>=0.8,<1.0",
]
embedding-benchmark = []
infra-benchmark = [
    "boto3>=1.35,<2.0",
    "pika>=1.3,<2.0",
    "psycopg[binary]>=3.2,<4.0",
]
ocr-benchmark = [
    "docling==2.111.0",
    "easyocr>=1.7,<2.0",
    "onnxruntime>=1.20,<2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "catalog_integration: requires disposable PostgreSQL, S3-compatible storage, and RabbitMQ",
    "database_integration: requires an explicit disposable PostgreSQL test database",
    "native_integration: requires disposable PostgreSQL and S3-compatible storage",
    "ocr_integration: requires native integration infrastructure and OCR binaries",
    "platform_integration: requires explicit local S3-compatible storage and RabbitMQ",
    "publication_integration: requires PostgreSQL, S3-compatible storage, OpenSearch, and a pinned local embedding model",
    "document_loader_e2e: requires the complete disposable document-loader platform",
    "worker_integration: requires the complete platform and running isolated worker containers",
]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
